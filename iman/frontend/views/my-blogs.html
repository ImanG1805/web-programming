<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <!-- header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4">
                <div>
                    <h2 class="mb-2">My Blogs</h2>
                    <p class="text-muted mb-0">Manage your blog posts and create new content</p>
                </div>
                <button class="btn btn-primary mt-2 mt-md-0" data-bs-toggle="modal" data-bs-target="#blogModal" id="addBlogBtn">
                    <i class="fas fa-plus me-2"></i>Add New Blog
                </button>
            </div>

            <!-- blogs grid -->
            <div id="blogsContainer" class="row g-4">
                <!-- it will load dynamically -->
            </div>

            <div id="noBlogs" class="text-center py-5" style="display: none;">
                <i class="fas fa-blog fa-3x text-muted mb-3"></i>
                <h4 class="text-muted">No blogs yet</h4>
                <p class="text-muted">Start by creating your first blog post!</p>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#blogModal">
                    <i class="fas fa-plus me-2"></i>Create Your First Blog
                </button>
            </div>
        </div>
    </div>
</div>

<!-- add edit modal -->
<div class="modal fade" id="blogModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="blogModalTitle">Add New Blog</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="blogForm">
                    <div class="mb-3">
                        <label for="blogTitle" class="form-label">Blog Title</label>
                        <input type="text" class="form-control" id="blogTitle" required>
                    </div>
                    <div class="mb-3">
                        <label for="blogDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="blogDescription" rows="3" required></textarea>
                        <div class="form-text">A short description of your blog post.</div>
                    </div>
                    <div class="mb-3">
                        <label for="blogImage" class="form-label">Image URL</label>
                        <input type="url" class="form-control" id="blogImage" required>
                    </div>
                    <div class="mb-3">
                        <label for="blogTags" class="form-label">Tags</label>
                        <input type="text" class="form-control" id="blogTags" placeholder="Separate tags with commas">
                        <div class="form-text">e.g., skincare, routine, tips</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveBlogBtn">Save Blog</button>
            </div>
        </div>
    </div>
</div>

<!-- del confirm modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this blog post? This action cannot be undone.</p>
                <p class="fw-bold" id="deleteBlogTitle"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>
</div>
