<!-- main -->
<div class="main-content">
    <div class="hero-section">
        <div class="container">
            <h1><i class="fas fa-spa"></i> Welcome to Glow & Grace</h1>
            <p>Your trusted source for skincare tips, product reviews, and beauty advice. Discover the secrets to radiant, healthy skin!</p>
        </div>
    </div>

    <!-- filter --->
    <div class="search-filter-section">
        <div class="container">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="morning routine">Morning Routine</button>
                <button class="filter-btn" data-filter="anti-aging">Anti-Aging</button>
                <button class="filter-btn" data-filter="skincare basics">Basics</button>
                <button class="filter-btn" data-filter="tips">Tips</button>
            </div>
        </div>
    </div>
    <!-- Blog Grid Section -->
    <div class="blog-grid">
        <div class="container">
            <div class="row g-4" id="blogContainer">
                <!-- Blogs will be inserted here by JavaScript -->
            </div>
            <div id="noResults" class="text-center py-5" style="display: none;">
                <i class="fas fa-search fa-3x text-muted mb-3"></i>
                <h3>No blogs found</h3>
                <p class="text-muted">Try adjusting your search or filter criteria</p>
            </div>
        </div>
    </div>
</div>
